name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        env:
          # 빌드마다 버전을 올려, 폰에서 업데이트가 반영됐는지 바로 알 수 있게 한다.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AutoScroll-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/AutoScroll-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroll-apk
          path: out/*.apk

      # 태그를 붙인 경우: 그 버전으로 릴리스를 만든다.
      - name: Attach APKs to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # softprops 는 이미 있는 태그를 옮기지 않아서, 릴리스 페이지가 예전 커밋을
      # 가리킨 채로 남는다. 먼저 태그를 이번 커밋으로 옮겨둔다.
      - name: Move the latest tag to this commit
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/latest';
            try {
              await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/${ref}`, sha: context.sha,
              });
            }

      # 평소 push: 폰에서 바로 받을 수 있도록 'latest' 릴리스를 갱신한다.
      - name: Update the latest release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: 최신 빌드 (자동 스크롤)
          body: |
            아래 **AutoScroll-release.apk** 를 눌러 내려받아 설치하세요.

            설치할 때 "출처를 알 수 없는 앱" 허용이 필요하고,
            설치 후 앱에서 접근성 서비스와 '다른 앱 위에 표시' 권한을 켜주세요.

            버전: 1.${{ github.run_number }} · 커밋 ${{ github.sha }}
          files: out/*.apk
          make_latest: true
