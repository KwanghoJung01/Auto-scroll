name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AutoScroll-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/AutoScroll-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroll-apk
          path: out/*.apk

      # 태그를 붙인 경우: 그 버전으로 릴리스를 만든다.
      - name: Attach APKs to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # 평소 push: 폰에서 바로 받을 수 있도록 'latest' 릴리스를 갱신한다.
      - name: Update the latest release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: 최신 빌드 (자동 스크롤)
          body: |
            아래 **AutoScroll-release.apk** 를 눌러 내려받아 설치하세요.

            설치할 때 "출처를 알 수 없는 앱" 허용이 필요하고,
            설치 후 앱에서 접근성 서비스와 '다른 앱 위에 표시' 권한을 켜주세요.

            커밋: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
