name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AutoScroll-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/AutoScroll-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoScroll-apk
          path: out/*.apk

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
